<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="recuperarcontrasena.css">
</head>
<body>
    <div class="container">
        <h1>Recuperar Contraseña</h1>
        <p class="description">Ingresa tu email y tu nueva contraseña para recuperar tu cuenta.</p>
        <form onsubmit="recuperarContrasena(event)" id="recuperarForm" method="POST">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="nuevaContrasena">Nueva Contraseña:</label>
                <input type="password" id="nuevaContrasena" name="nuevaContrasena" placeholder="••••••••" required>
            </div>
            <button type="submit">Recuperar Contraseña</button>
            <button type="button" onclick="window.location.href='login.html'">Volver a Login</button>
        </form>
    </div>

    <script src="recuperarcontrasena.js"></script>
</body>
</html>
