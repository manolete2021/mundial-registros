<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Groups - Gestión de Jugadores</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h1 class="welcome-title">BIENVENIDOS JUGADORES</h1>
            <p class="subtitle">WORLD CUP GROUPS</p>
        </div>

        <!-- Group Buttons -->
        <div class="group-buttons">
            <button class="group-btn" data-group="A">GROUP A</button>
            <button class="group-btn" data-group="B">GROUP B</button>
            <button class="group-btn" data-group="C">GROUP C</button>
            <button class="group-btn" data-group="D">GROUP D</button>
        </div>

        <!-- Table Section -->
        <div class="table-section">
            <h2 class="table-title" id="currentGroupTitle">GROUP A</h2>
            <div class="table-container">
                <table id="playersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NAME</th>
                            <th>EMAIL</th>
                            <th>PASSWORD</th>
                        </tr>
                    </thead>
                    <tbody id="playersTableBody">
                        <!-- Players will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
            <button class="create-new-btn" id="createNewBtn">CREATE NEW</button>
        </div>

        <!-- Form Section -->
        <div class="form-section" id="formSection" style="display: none;">
            <h2 class="form-title">ADD NEW MEMBER</h2>
            <form id="playerForm">
                <div class="form-row">
                    <div class="form-field">
                        <label>ID</label>
                        <input type="text" id="playerId" required>
                    </div>
                    <div class="form-field">
                        <label>NAME</label>
                        <input type="text" id="playerName" required>
                    </div>
                    <div class="form-field">
                        <label>EMAIL</label>
                        <input type="email" id="playerEmail" required>
                    </div>
                    <div class="form-field">
                        <label>PASSWORD</label>
                        <input type="password" id="playerPassword" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="group-btn-submit">GROUP (BUTTON)</button>
                </div>
            </form>
        </div>
    </div>

    <script src="home.js"></script>
</body>
</html>
